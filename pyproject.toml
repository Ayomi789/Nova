[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-ai"
version = "0.2.0"
description = "Nova AI Launcher"
requires-python = ">=3.10"

[project.scripts]
nova = "launcher:main"

[tool.setuptools]
py-modules = ["launcher"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "brain*",
    "scripts*",
    "launchers*",
    "clients*",
    "tools*",
]