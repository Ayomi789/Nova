services:
  - type: web
    name: nova-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: python serve_demo.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NOVA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
